<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 API 테스트</h1>

    <button onclick="testAPI()">API 테스트 시작</button>

    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '테스트 중...';
            resultDiv.className = '';

            try {
                console.log('API 호출 시작...');

                const response = await fetch('http://localhost:8000/chatbot-api.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Hello, how are you?',
                        model: 'mistralai/Mixtral-8x7B-Instruct-v0.1'
                    })
                });

                console.log('응답 상태:', response.status);
                console.log('응답 헤더:', response.headers);

                const text = await response.text();
                console.log('응답 내용:', text);

                if (!response.ok) {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `
❌ HTTP 오류: ${response.status}

응답 내용:
${text}
                    `;
                    return;
                }

                resultDiv.className = 'success';
                resultDiv.innerHTML = `
✅ 성공!

응답 상태: ${response.status}

응답 내용:
${text}
                `;

                // JSON 파싱 시도
                try {
                    const json = JSON.parse(text);
                    resultDiv.innerHTML += `\n\n파싱된 JSON:\n${JSON.stringify(json, null, 2)}`;
                } catch (e) {
                    console.log('JSON 파싱 실패:', e);
                }

            } catch (error) {
                console.error('오류:', error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
❌ 오류 발생:

${error.message}

자세한 내용은 브라우저 콘솔(F12)을 확인하세요.
                `;
            }
        }

        // 페이지 로드 시 자동 실행
        window.addEventListener('load', () => {
            console.log('테스트 페이지 로드됨');
            console.log('버튼을 클릭해서 API를 테스트하세요.');
        });
    </script>
</body>
</html>
